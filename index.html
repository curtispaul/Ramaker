<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="menu-data.js"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0d16;
      color: #f0ece4;
      font-family: 'Raleway', system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse 120% 80% at 50% -10%, #1e1e38 0%, #0d0d16 55%);
    }

    /* Corner decorations */
    .corner {
      position: fixed;
      width: 3.5vw;
      height: 3.5vw;
      border-color: rgba(201, 169, 110, 0.45);
      border-style: solid;
      z-index: 10;
    }
    .corner-tl { top: 1.2vw; left: 1.2vw;  border-width: 2px 0 0 2px; }
    .corner-tr { top: 1.2vw; right: 1.2vw; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 1.2vw; left: 1.2vw;  border-width: 0 0 2px 2px; }
    .corner-br { bottom: 1.2vw; right: 1.2vw; border-width: 0 2px 2px 0; }

    /* Header */
    header {
      flex-shrink: 0;
      text-align: center;
      padding: 2.2vh 6vw 1.8vh;
      border-bottom: 1px solid rgba(201, 169, 110, 0.25);
      position: relative;
    }

    header::after {
      content: '';
      display: block;
      width: 6vw;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
      margin: 1.2vh auto 0;
    }

    .restaurant-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(28px, 4vw, 72px);
      font-weight: 700;
      color: #c9a96e;
      letter-spacing: 0.06em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(201, 169, 110, 0.2);
    }

    .tagline {
      font-size: clamp(10px, 1.05vw, 18px);
      color: rgba(240, 236, 228, 0.5);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-top: 0.6vh;
      font-weight: 300;
    }

    /* Menu grid */
    .menu-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(var(--col-count, 4), 1fr);
      overflow: hidden;
      padding: 2vh 2.5vw;
      gap: 0;
    }

    .category {
      display: flex;
      flex-direction: column;
      padding: 1.5vh 2vw;
      border-right: 1px solid rgba(201, 169, 110, 0.12);
      animation: fadeInUp 0.6s ease both;
    }

    .category:last-child {
      border-right: none;
    }

    .category:nth-child(1) { animation-delay: 0.1s; }
    .category:nth-child(2) { animation-delay: 0.2s; }
    .category:nth-child(3) { animation-delay: 0.3s; }
    .category:nth-child(4) { animation-delay: 0.4s; }
    .category:nth-child(5) { animation-delay: 0.5s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .category-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(16px, 1.7vw, 32px);
      font-weight: 700;
      color: #c9a96e;
      text-align: center;
      letter-spacing: 0.08em;
      padding-bottom: 1.2vh;
      margin-bottom: 1.5vh;
      border-bottom: 1px solid rgba(201, 169, 110, 0.35);
      position: relative;
    }

    .category-name::before,
    .category-name::after {
      content: '—';
      color: rgba(201, 169, 110, 0.4);
      font-size: 0.6em;
      margin: 0 0.6em;
    }

    .items-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .item {
      display: flex;
      flex-direction: column;
      padding: 0.85vh 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.055);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.8vw;
    }

    /* Dotted leader line between name and price */
    .item-leader {
      flex: 1;
      border-bottom: 1px dotted rgba(201, 169, 110, 0.2);
      margin: 0 0.4vw 0.2vh;
      min-width: 1vw;
    }

    .item-name {
      font-size: clamp(11px, 1.15vw, 22px);
      font-weight: 600;
      color: #f0ece4;
      white-space: nowrap;
    }

    .item-price {
      font-size: clamp(11px, 1.15vw, 22px);
      font-weight: 600;
      color: #c9a96e;
      white-space: nowrap;
    }

    .item-description {
      font-size: clamp(9px, 0.85vw, 16px);
      color: rgba(240, 236, 228, 0.48);
      font-weight: 300;
      font-style: italic;
      margin-top: 0.1vh;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <header>
    <div class="restaurant-name" id="restaurant-name"></div>
    <div class="tagline" id="tagline"></div>
  </header>

  <div class="menu-grid" id="menu-grid"></div>

  <script>
    const grid = document.getElementById('menu-grid');

    document.getElementById('restaurant-name').textContent = menuData.restaurantName;
    document.getElementById('tagline').textContent        = menuData.tagline;

    grid.style.setProperty('--col-count', menuData.categories.length);

    menuData.categories.forEach(category => {
      const section = document.createElement('div');
      section.className = 'category';

      const heading = document.createElement('div');
      heading.className = 'category-name';
      heading.textContent = category.name;
      section.appendChild(heading);

      const list = document.createElement('div');
      list.className = 'items-list';

      category.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';

        const row = document.createElement('div');
        row.className = 'item-row';

        const name = document.createElement('span');
        name.className = 'item-name';
        name.textContent = item.name;

        const leader = document.createElement('span');
        leader.className = 'item-leader';

        const price = document.createElement('span');
        price.className = 'item-price';
        price.textContent = item.price;

        row.appendChild(name);
        row.appendChild(leader);
        row.appendChild(price);
        el.appendChild(row);

        if (item.description) {
          const desc = document.createElement('div');
          desc.className = 'item-description';
          desc.textContent = item.description;
          el.appendChild(desc);
        }

        list.appendChild(el);
      });

      section.appendChild(list);
      grid.appendChild(section);
    });
  </script>
</body>
</html>
